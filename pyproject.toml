[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-faq-cache"
version = "1.0.0"
description = "Measured multilingual semantic caching for an e-commerce FAQ bot"
requires-python = ">=3.11"
dependencies = ["sentence-transformers>=3,<7", "faiss-cpu>=1.9,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["faq_cache*"]
