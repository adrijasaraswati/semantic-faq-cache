services:
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
  model-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list; do sleep 2; done; ollama pull qwen2.5:0.5b"]
    depends_on: [ollama]
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      CACHE_THRESHOLD: ${CACHE_THRESHOLD:-0.75}
    volumes: ["runtime:/app/runtime"]
    depends_on:
      model-pull:
        condition: service_completed_successfully
volumes:
  ollama:
  runtime:
