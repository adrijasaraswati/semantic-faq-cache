name: reproducible benchmark
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/benchmark.yml']
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial source delivery
        run: |
          if test -f project-source.zip; then
            unzip -o project-source.zip
            git rm project-source.zip
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m 'Expand Python source, datasets, and local benchmark evidence'
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]' pillow imageio imageio-ffmpeg
      - run: pytest -q
      - name: Install local Ollama and model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:11434/api/tags && break; sleep 2; done
          ollama pull qwen2.5:0.5b
      - run: python -m faq_cache.evaluate --llm
      - run: python -m faq_cache.demo
      - run: python scripts/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-results
          path: results/
      - name: Commit measured evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'Record real CPU benchmark and cold-cache demo' || exit 0
          git push
